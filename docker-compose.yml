version: '3'

services:

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: posdb
      MYSQL_USER: posuser
      MYSQL_PASSWORD: pospass
    volumes:
      - dbdata:/var/lib/mysql

  web:
    build: .
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - db

volumes:
  dbdata:
